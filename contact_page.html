<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-main: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 450px; /* Perfect width for a mobile-first look */
            padding: 40px 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        /* Logo Styling */
        .logo-container {
            margin-bottom: 20px;
        }

        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%; /* Makes the image round */
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: #222;
        }

        /* Button Styling */
        .contact-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            text-decoration: none;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .btn i {
            position: absolute;
            left: 24px;
            font-size: 1.4rem;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        /* Brand Colors */
        .btn-whatsapp {
            background-color: #25D366;
        }

        .btn-phone {
            background-color: #007BFF;
        }

        .btn-facebook {
            background-color: #1877F2;
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }

        .btn-google {
            background-color: #DB4437;
        }

        /* Mobile Responsiveness */
        @media (max-width: 400px) {
            .btn {
                font-size: 1rem;
                padding: 14px;
            }
            .btn i {
                left: 20px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Logo Section -->
        <div class="logo-container">
            <!-- REPLACE 'your-logo-here.png' with your actual logo file name -->
            <img src="https://sathyabama-est.github.io/SS_BIRIYANI/IMG-20260422-WA0003.jpg" alt="Restaurant Logo" class="logo" id="brand-logo">
        </div>

        <h1 class="brand-name">Contact Us</h1>

        <!-- Links Section -->
        <div class="contact-links">
            
            <!-- WhatsApp (Replace 919876543210 with your number with country code) -->
            <a href="https://wa.me/9191765 50101" class="btn btn-whatsapp" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp
            </a>

            <!-- Phone (Replace +919876543210 with your number) -->
            <a href="tel:+9191765 50101" class="btn btn-phone">
                <i class="fa-solid fa-phone"></i> Call Us
            </a>

            <!-- Facebook -->
            <a href="https://www.facebook.com/share/19AnQDcRZu/" class="btn btn-facebook" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-facebook-f"></i> Facebook
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/tambaramssbiriyani?igsh=eDdidGhuNXQ0Znl4" class="btn btn-instagram" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-instagram"></i> Instagram
            </a>

            <!-- Google Maps/Reviews -->
            <a href="TAMBARAM SS BIRYANI https://share.google/69QXXLUlcoWsjbEA2" class="btn btn-google" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-google"></i> Google
            </a>

        </div>
    </div>

</body>
</html>
